# ============================================================
# Gitleaks 安全扫描配置
#
# 用途：
#   1. 继承官方默认敏感信息检测规则
#   2. 排除确认无风险的文件及误报
#   3. 增加项目自定义敏感信息检测规则
#   4. 检测常见大模型服务的 API Key
#
# 适用版本：Gitleaks v8.25+
#
# 推荐使用方式：
#   gitleaks git --pre-commit --staged --redact=100
#   gitleaks git . --redact=100
#
# 注意：
#   白名单仅用于已确认的误报。
#   不应为了让扫描通过而忽略整个业务目录。
# ============================================================

title = "HM Insurance - Gitleaks Security Configuration"

# ------------------------------------------------------------
# 1. 继承官方默认规则
# ------------------------------------------------------------

[extend]

# true：继承 Gitleaks 内置的所有默认检测规则
# false：不自动继承，需要自行提供规则
#
# 推荐始终保持 true，避免遗漏常见密钥类型：
# GitHub Token、AWS Key、OpenAI Key、私钥等
useDefault = true

# 如需禁用某一条官方规则，可使用 disabledRules。
# 仅当明确确认规则不适用时才启用。
#
# disabledRules = ["某个官方规则ID"]


# ------------------------------------------------------------
# 2. 全局白名单
# ------------------------------------------------------------
#
# 全局白名单对所有检测规则生效。
#
# paths 使用 Go 正则表达式，而不是 Glob。
# 示例：
#   \.yaml$         匹配以 .yaml 结尾的路径
#   (?:^|/)tests/   匹配根目录或子目录中的 tests/
#
# 注意：
#   整个文件被排除后，其中真实存在的密钥也不会报告。
#   优先使用精确路径，而不是排除整个目录。
# ------------------------------------------------------------

[[allowlists]]

description = "忽略已确认无风险的依赖锁文件"

paths = [
    # pnpm 依赖锁文件
    # 官方默认规则通常已排除，此处显式声明方便维护
    '''(?:^|/)pnpm-lock\.yaml$''',

    # Python uv 依赖锁文件
    # 仅在确认锁文件不包含认证信息时启用
    '''(?:^|/)uv\.lock$''',

    #'\.env\.example$',
    #'frontend/src/.*',  # 忽略前端 src 目录下的所有文件误报 或者 // gitleaks:allow
    # 不建议排除以下文件或目录：
    #
    # .env.example
    # frontend/src/
    # backend/
    # src/
    #
    # 原因：
    # 示例配置和业务源代码也可能包含真实密钥。
    #
    # 如需忽略特定误报，优先使用：
    #   1. 规则级 allowlists
    #   2. .gitleaksignore 中的 Fingerprint
    #   3. 单行注释 gitleaks:allow（谨慎使用）
]

# ------------------------------------------------------------
# 3. 自定义规则：大模型 API Key
# ------------------------------------------------------------
#
# 检测以下变量名中的硬编码密钥：
#
# DEEPSEEK_API_KEY
# SILICONFLOW_API_KEY
# SILICON_API_KEY
# DASHSCOPE_API_KEY
# OPENAI_API_KEY
# MINERU_API_KEY
#
# 支持格式：
#
# DEEPSEEK_API_KEY=sk-xxxxxxxx
# OPENAI_API_KEY = "sk-xxxxxxxx"
# DASHSCOPE_API_KEY: sk-xxxxxxxx
#
# 此规则是补充检测，并非各平台真实密钥格式的
# 完整校验，其他凭据格式仍依赖官方默认规则。
# ------------------------------------------------------------

[[rules]]
id = "custom-ai-api-keys"

description = "检测硬编码的大模型 API Key"

# 匹配常见环境变量赋值形式。
#
# (?i)       忽略大小写
# \b         变量名前的单词边界
# [ \t]*     允许空格和 Tab
# [:=]       支持 = 和 : 赋值
# ["']?      支持可选的引号
#
# 密钥部分：
#   允许字母、数字、下划线、连字符
#   长度为 20–128 字符
#   支持 sk- 开头及其他符合字符规则的格式
#
# 注意：不覆盖所有 YAML/JSON/代码表达式，
# 也不代表满足长度要求的值一定是真实密钥。

regex = '''(?i)\b(?:DEEPSEEK|SILICONFLOW|SILICON|DASHSCOPE|OPENAI|MINERU)_API_KEY[ \t]*[:=][ \t]*["']?([A-Za-z0-9][A-Za-z0-9_-]{19,127})'''

# 使用第 1 个捕获组作为敏感信息，
# 不将变量名和赋值符号包含在 Secret 字段中。
secretGroup = 1

# 提前过滤文本，减少不必要的正则计算。
# keywords 不区分大小写。
keywords = [
    "deepseek_api_key",
    "siliconflow_api_key",
    "silicon_api_key",
    "dashscope_api_key",
    "openai_api_key",
    "mineru_api_key",
]

# 仅作为分类元数据，不影响检测行为。
tags = ["custom", "ai", "api-key"]


# ------------------------------------------------------------
# 4. AI Key 规则专属白名单
# ------------------------------------------------------------
#
# 仅影响 custom-ai-api-keys 规则，
# 不影响其他官方检测规则。
#
# regexTarget = "secret"
# 表示只对提取出的密钥值进行白名单匹配。
#
# 仅忽略明确的测试占位值。
# 不建议使用宽泛的 fake、test 等子串过滤，
# 以免意外放过真实密钥。
# ------------------------------------------------------------

[[rules.allowlists]]

description = "忽略明确的 AI API Key 测试占位符"

regexTarget = "secret"

regexes = [
    '''(?i)^x{20,128}$''',
    '''(?i)^0{20,128}$''',
    '''(?i)^example[_-]key[_-][a-z0-9_-]{8,100}$''',
]


# ------------------------------------------------------------
# 5. 可选规则：硬编码密码
# ------------------------------------------------------------
#
# 官方默认规则已经包含通用密码检测能力。
# 不建议直接增加过于宽泛的 password 正则，
# 容易将测试数据、配置说明识别为密码。
#
# 如果实际项目有固定的内部敏感字段，
# 可以另外增加针对性规则，例如：
#
# [[rules]]
# id = "custom-internal-secret"
# description = "检测项目内部敏感字段"
# regex = '''INTERNAL_SECRET[ \t]*[:=][ \t]*["']?([A-Za-z0-9_-]{24,})'''
# secretGroup = 1
# keywords = ["internal_secret"]
# tags = ["custom", "internal", "secret"]

# ------------------------------------------------------------
# 6. 维护原则
# ------------------------------------------------------------
#
# 1. 定期更新 Gitleaks，获取最新默认规则。
# 2. 不要直接覆盖或替换官方规则集。
# 3. 不要忽略整个 src、frontend、backend 目录。
# 4. 不要将真实泄露的密钥加入白名单。
# 5. 密钥泄露后应立即撤销或轮换。
# 6. 本地 Git Hook 与 CI 使用相同配置文件。
# 7. CI 扫描结果建议使用 --redact=100 脱敏。
#
# ============================================================